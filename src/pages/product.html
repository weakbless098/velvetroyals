    <script>
        const esc = (str) => String(str ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        const catLabels = { flower: 'Flower', arrangement: 'Arrangement', gift: 'Gift', bundle: 'Bundle', chocolates: 'Chocolates', cakes: 'Cakes & Pastries' };
        const badgeLabels = { new: 'NEW', bestseller: 'BESTSELLER', hotpick: 'HOT PICK', sale: 'SALE', bundle: 'BUNDLE' };
        const occasionLabels = { birthday:'Birthday', anniversary:'Anniversary', wedding:'Wedding', valentine:"Valentine's", getwell:'Get Well', graduation:'Graduation', baby:'New Baby', romantic:'Romantic', mothersday:"Mother's Day", fathersday:"Father's Day", congratulations:'Congrats', bridalshower:'Bridal Shower', babygirl:'Baby Girl', babyboy:'Baby Boy', babyshower:'Baby Shower', corporate:'Corporate', sympathy:'Sympathy', christmas:'Christmas', sorry:"I'm Sorry" };
        const recipientLabels = { her:'For Her', him:'For Him', parents:'For Parents', baby:'For Baby', friend:'For Friend' };

        let _product = null;

        // ── Load product ──────────────────────────────────────────────────────

        const loadProduct = async (productId) => {
            // Fast first paint from cache (may be slightly stale)...
            let paintedFromCache = false;
            try {
                const raw = localStorage.getItem('rv_products_v1');
                if (raw) {
                    const { data } = JSON.parse(raw);
                    const found = (data || []).find(p => String(p.id) === String(productId));
                    if (found) { renderProduct(found); paintedFromCache = true; }
                }
            } catch {}

            // ...then always reconcile with Firebase (the source of truth) so
            // an admin price/detail edit shows immediately, never a stale cache.
            try {
                const snap = await firebase.database().ref('flowers/' + productId).once('value');
                if (snap.exists()) {
                    renderProduct({ id: snap.key, ...snap.val() });
                } else {
                    showNotFound();
                }
            } catch (e) {
                console.error('Failed to load product:', e);
                if (!paintedFromCache) showNotFound();
            }
        };

        // ── Render ────────────────────────────────────────────────────────────

        const renderProduct = (product) => {
            _product = product;

            document.title = esc(product.name) + ' | Velvet Royals Flowershop';
            document.getElementById('pd-breadcrumb-name').textContent = product.name;

            const cat      = product.category || 'flower';
            const label    = catLabels[cat] || 'Flower';
            const badgeKey = cat === 'bundle' ? 'bundle' : (product.badge || '');

            const badgeHtml = badgeKey
                ? `<span class="product-ribbon ribbon-${esc(badgeKey)}">${esc(badgeLabels[badgeKey] || badgeKey.toUpperCase())}</span>`
                : '';

            const occHtml = product.occasion
                ? `<span class="product-tag tag-occasion">${esc(occasionLabels[product.occasion] || product.occasion)}</span>` : '';
            const recHtml = product.recipient
                ? `<span class="product-tag tag-recipient">${esc(recipientLabels[product.recipient] || product.recipient)}</span>` : '';
            const tagsHtml = (occHtml || recHtml) ? `<div class="product-tags">${occHtml}${recHtml}</div>` : '';

            const fallbackImg = 'https://storage.googleapis.com/flowershop-d26f4.firebasestorage.app/products/1.jpg';
            const rawImg = product.image || '';
            const mainImg = (rawImg.startsWith('http') || rawImg.startsWith('/') || rawImg.startsWith('data:'))
                ? rawImg : fallbackImg;

            // Support images array (if admin uploaded multiple)
            const images = Array.isArray(product.images) && product.images.length
                ? product.images
                : [mainImg];

            const thumbsHtml = images.length > 1
                ? `<div class="pd-thumbs">
                    ${images.map((src, i) =>
                        `<button class="pd-thumb${i === 0 ? ' active' : ''}" onclick="pdSetImage('${esc(src)}', this)">
                            <img src="${esc(src)}" alt="View ${i + 1}" loading="lazy" onerror="this.onerror=null;this.src='${fallbackImg}'">
                        </button>`
                    ).join('')}
                   </div>`
                : '';

            const effectivePrice = (product.salePrice && product.salePrice > 0 && product.salePrice < product.price)
                ? product.salePrice : product.price;
            const isOnSale = effectivePrice < product.price;
            const displayPrice = 'AED ' + parseFloat(effectivePrice).toFixed(2);
            const waText  = encodeURIComponent(`Hi Velvet Royals! I'd like to order: ${product.name} (AED ${parseFloat(effectivePrice).toFixed(2)})`);

            document.getElementById('pd-wrapper').innerHTML = `
                <div class="pd-layout">
                    <div class="pd-gallery">
                        <div class="pd-main-img-wrap">
                            ${badgeHtml}
                            <img id="pd-main-img" src="${esc(mainImg)}" alt="${esc(product.name)}"
                                onerror="this.onerror=null;this.src='${fallbackImg}'">
                        </div>
                        ${thumbsHtml}

                        <div class="pd-guarantees">
                            <div class="pd-guarantee-item">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                                Same-day delivery
                            </div>
                            <div class="pd-guarantee-item">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
                                Freshness guaranteed
                            </div>
                            <div class="pd-guarantee-item">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                Handpicked with care
                            </div>
                        </div>
                    </div>

                    <div class="pd-info">
                        <div class="pd-info-top">
                            <span class="product-category-badge badge-${esc(cat)}">${esc(label)}</span>
                            ${tagsHtml}
                        </div>
                        <h1 class="pd-name">${esc(product.name)}</h1>
                        ${isOnSale
                            ? `<div class="pd-price-wrap">
                                <span class="pd-price-original">AED ${parseFloat(product.price).toFixed(2)}</span>
                                <span class="pd-price-sale">AED ${parseFloat(effectivePrice).toFixed(2)}</span>
                               </div>`
                            : `<p class="pd-price">AED ${parseFloat(product.price).toFixed(2)}</p>`
                        }
                        <p class="pd-desc">${esc(product.description)}</p>
                        ${product.quantity ? (() => {
                            const items = product.quantity.split(',').map(s => s.trim()).filter(Boolean);
                            return `<div class="pd-quantity-block">
                                <div class="pd-quantity-header">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 12l2.5 2.5L16 9"/></svg>
                                    <span class="pd-quantity-label">What's Included</span>
                                </div>
                                <ul class="pd-quantity-items">
                                    ${items.map(item => `<li>${esc(item)}</li>`).join('')}
                                </ul>
                            </div>`;
                        })() : ''}
                        ${(() => {
                            // "Perfect For" — admin-typed list wins; otherwise
                            // auto-generated from the product's occasion,
                            // recipient, and wording, so every product has one.
                            let items;
                            if (product.perfectFor) {
                                items = product.perfectFor.split(',').map(s => s.trim()).filter(Boolean);
                            } else {
                                const text = ((product.name || '') + ' ' + (product.description || '')).toLowerCase();
                                const occ = product.occasion || '';
                                const rec = product.recipient || '';
                                items = [];
                                const add = (x) => { if (!items.includes(x)) items.push(x); };
                                const occLabels = { birthday: 'Birthdays', anniversary: 'Anniversaries', wedding: 'Wedding Gifts', valentine: "Valentine's Day", getwell: 'Get Well Wishes', graduation: 'Graduation Celebrations', baby: 'New Baby Celebrations', romantic: 'Romantic Occasions', mothersday: "Mother's Day", fathersday: "Father's Day", congratulations: 'Congratulations', bridalshower: 'Bridal Shower', babygirl: 'Baby Girl Celebrations', babyboy: 'Baby Boy Celebrations', babyshower: 'Baby Showers', corporate: 'Luxury Corporate Gifts', sympathy: 'Sympathy & Condolences', christmas: 'Christmas Celebrations', sorry: 'Heartfelt Apologies' };
                                if (occLabels[occ]) add(occLabels[occ]);
                                if (/rose|romanc|romantic|love|heart/.test(text) || rec === 'her') add('Romantic Occasions');
                                add('Anniversaries');
                                add('Birthdays');
                                if (/rose|red|pink|romantic|love/.test(text)) add("Valentine's Day");
                                if (rec === 'her' || rec === 'parents' || /mother|mum|mom/.test(text)) add("Mother's Day");
                                if (/bridal|bride|wedding/.test(text) || occ === 'wedding') { add('Wedding Gifts'); add('Bridal Shower'); }
                                if (/corporate|centerpiece|center piece/.test(text)) add('Luxury Corporate Gifts');
                                add('Congratulations');
                                add('Thank You');
                                add('Just Because');
                            }
                            if (!items.length) return '';
                            return `<div class="pd-quantity-block pd-perfectfor-block">
                                <div class="pd-quantity-header">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                    <span class="pd-quantity-label">Perfect For</span>
                                </div>
                                <div class="pd-pf-pills">
                                    ${items.map(item => `<span class="pd-pf-pill">${esc(item)}</span>`).join('')}
                                </div>
                            </div>`;
                        })()}

                        <div class="pd-divider"></div>

                        <div class="pd-actions">
                            <button class="button pd-add-btn" id="pd-add-btn" onclick="pdAddToCart()">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                                Add to Cart
                            </button>
                            <a class="pd-wa-btn" href="https://api.whatsapp.com/send?phone=971507443100&text=${waText}" target="_blank" rel="noopener">
                                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
                                Order via WhatsApp
                            </a>
                        </div>

                    </div>
                </div>
                <div class="pd-sticky-cta" id="pd-sticky-cta">
                    <div class="pd-sticky-cta-info">
                        <span class="pd-sticky-cta-name">${esc(product.name)}</span>
                        <span class="pd-sticky-cta-price${isOnSale ? ' on-sale' : ''}">${displayPrice}</span>
                    </div>
                    <button class="button pd-sticky-cta-btn" onclick="pdAddToCart()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                        Add to Cart
                    </button>
                </div>`;

            initStickyCtaObserver();
            initImageZoom();
        };

        // ── Image zoom ────────────────────────────────────────────────────────
        // Desktop: hover magnifies, zoom follows the cursor.
        // Touch devices: tap opens the photo fullscreen.

        const initImageZoom = () => {
            const wrap = document.querySelector('.pd-main-img-wrap');
            const img  = document.getElementById('pd-main-img');
            if (!wrap || !img) return;

            if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                wrap.classList.add('pd-zoomable');
                wrap.addEventListener('mousemove', (e) => {
                    const r = wrap.getBoundingClientRect();
                    const x = ((e.clientX - r.left) / r.width) * 100;
                    const y = ((e.clientY - r.top) / r.height) * 100;
                    img.style.transformOrigin = x + '% ' + y + '%';
                });
                wrap.addEventListener('mouseenter', () => { img.style.transform = 'scale(2.2)'; });
                wrap.addEventListener('mouseleave', () => {
                    img.style.transform = '';
                    img.style.transformOrigin = 'center center';
                });
            } else {
                wrap.addEventListener('click', () => {
                    let lb = document.getElementById('pd-img-lightbox');
                    if (!lb) {
                        lb = document.createElement('div');
                        lb.id = 'pd-img-lightbox';
                        lb.className = 'pd-img-lightbox';
                        lb.innerHTML = '<img alt="Product photo"><span class="pd-img-lightbox-close" aria-label="Close">&times;</span>';
                        lb.addEventListener('click', () => lb.classList.remove('active'));
                        document.body.appendChild(lb);
                    }
                    lb.querySelector('img').src = img.src;
                    lb.classList.add('active');
                });
            }
        };

        // ── Sticky CTA observer ───────────────────────────────────────────────

        const initStickyCtaObserver = () => {
            const addBtn = document.getElementById('pd-add-btn');
            const cta    = document.getElementById('pd-sticky-cta');
            if (!addBtn || !cta) return;
            const obs = new IntersectionObserver(entries => {
                cta.classList.toggle('visible', !entries[0].isIntersecting);
            }, { threshold: 0.5 });
            obs.observe(addBtn);
        };

        // ── Gallery switcher ──────────────────────────────────────────────────

        const pdSetImage = (src, btn) => {
            const mainImg = document.getElementById('pd-main-img');
            if (mainImg) { mainImg.src = src; mainImg.style.opacity = '0'; setTimeout(() => mainImg.style.opacity = '1', 10); }
            document.querySelectorAll('.pd-thumb').forEach(t => t.classList.remove('active'));
            if (btn) btn.classList.add('active');
        };
        window.pdSetImage = pdSetImage;

        // ── Add to Cart ───────────────────────────────────────────────────────

        const pdAddToCart = () => {
            if (!_product) return;
            const _effectivePrice = (_product.salePrice && _product.salePrice > 0 && _product.salePrice < _product.price)
                ? _product.salePrice : _product.price;
            app.addToCart(_product.id, _product.name, _effectivePrice, _product.image || '');
            window.location.href = 'cart.html';
        };
        window.pdAddToCart = pdAddToCart;

        // ── Not found ────────────────────────────────────────────────────────

        const showNotFound = () => {
            document.getElementById('pd-breadcrumb-name').textContent = 'Not Found';
            document.getElementById('pd-wrapper').innerHTML = `
                <div class="pd-not-found">
                    <p>Sorry, this product could not be found.</p>
                    <a href="products.html" class="button">Browse All Products</a>
                </div>`;
        };

        // ── Init ─────────────────────────────────────────────────────────────

        document.addEventListener('DOMContentLoaded', () => {
            authModule.updateNavAuth();

            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');
            if (!productId) { showNotFound(); return; }
            loadProduct(productId);
        });
    </script>
</body>

</html>
