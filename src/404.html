<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Velvet Royals Flowershop</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=20260728c">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        .notfound-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
            background: linear-gradient(160deg, #1A1005 0%, #2A1E08 60%, #F9F5F0 60%);
        }
        .notfound-number {
            font-family: var(--font-display);
            font-size: clamp(5rem, 20vw, 10rem);
            color: #D4AF37;
            line-height: 1;
            opacity: 0.18;
            letter-spacing: -0.04em;
            position: absolute;
            pointer-events: none;
        }
        .notfound-card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.1);
            position: relative;
        }
        .notfound-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            display: block;
        }
        .notfound-card h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--color-text);
            margin-bottom: 12px;
        }
        .notfound-card p {
            color: var(--color-text-muted);
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .notfound-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .notfound-btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--color-accent, #D4AF37);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: var(--font-body);
        }
        .notfound-btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            color: var(--color-text-muted);
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid var(--color-border);
            text-decoration: none;
            font-size: 0.9rem;
            font-family: var(--font-body);
        }
    </style>
</head>
<body>
    <main class="notfound-wrap">
        <span class="notfound-number">404</span>
        <div class="notfound-card">
            <span class="notfound-icon"><svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#c8a43a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 9a3 3 0 0 0 3-3c0-1.66-1.34-3-3-3S9 4.34 9 6a3 3 0 0 0 3 3z"></path><path d="M12 15a3 3 0 0 1 3 3c0 1.66-1.34 3-3 3s-3-1.34-3-3a3 3 0 0 1 3-3z"></path><path d="M9 12a3 3 0 0 0-3-3c-1.66 0-3 1.34-3 3s1.34 3 3 3a3 3 0 0 0 3-3z"></path><path d="M15 12a3 3 0 0 1 3-3c1.66 0 3 1.34 3 3s-1.34 3-3 3a3 3 0 0 1-3-3z"></path></svg></span>
            <h1>Page Not Found</h1>
            <p>The page you're looking for may have moved or no longer exists. Let's find something beautiful for you instead.</p>
            <div class="notfound-actions">
                <a href="index.html" class="notfound-btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Go Home
                </a>
                <a href="pages/products.html" class="notfound-btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    Browse Flowers
                </a>
            </div>
        </div>
    </main>
</body>
</html>
